name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api
  CORS_ORIGIN: http://localhost:3000
  FRONTEND_URL: http://localhost:3000
  GOOGLE_CALLBACK_URL: http://localhost:8080/api/auth/google/callback
  # The tests use a signed local OIDC provider, never a real Google account.
  GOOGLE_CLIENT_ID: ''
  GOOGLE_CLIENT_SECRET: ''
  COOKIE_SAME_SITE: lax

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: HTTP integration tests
        run: pnpm test:e2e

      - name: Validate Prisma schema
        run: pnpm prisma:validate

      - name: Build web and server
        run: pnpm build

  database:
    name: Database integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: commit_health_ci
          # Disposable CI container credentials only.
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: commit_health_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commit_health_ci -d commit_health_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://commit_health_ci:ci_test_only@127.0.0.1:5432/commit_health_test?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply test migrations and run database integration tests
        run: pnpm test:db

  notify:
    name: Discord CI Notification
    runs-on: ubuntu-24.04
    needs: [quality, database]

    if: >-
      ${{
        !cancelled() &&
        github.actor != 'dependabot[bot]' &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        )
      }}

    steps:
      - name: Send Discord notification
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          QUALITY: ${{ needs.quality.result }}
          DATABASE: ${{ needs.database.result }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "Discord webhook is not configured."
            exit 0
          fi

          if [ "$QUALITY" = "success" ] && \
             [ "$DATABASE" = "success" ]; then
            TITLE="✅ CI 검사 성공"
            COLOR=5763719
          else
            TITLE="❌ CI 검사 실패"
            COLOR=15548997
          fi

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg actor "$ACTOR" \
            --arg event "$EVENT" \
            --arg quality "$QUALITY" \
            --arg database "$DATABASE" \
            --arg url "$RUN_URL" \
            --argjson color "$COLOR" \
            '{
              embeds: [{
                title: $title,
                color: $color,
                fields: [
                  {name:"저장소", value:$repo, inline:true},
                  {name:"브랜치", value:$branch, inline:true},
                  {name:"실행자", value:$actor, inline:true},
                  {name:"이벤트", value:$event, inline:true},
                  {name:"코드 품질 및 빌드", value:$quality, inline:true},
                  {name:"DB 통합 테스트", value:$database, inline:true}
                ],
                description: ("[GitHub Actions 결과 확인](" + $url + ")")
              }]
            }')

          curl --fail-with-body -sS \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL"
        
