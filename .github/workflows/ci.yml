name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api
  CORS_ORIGIN: http://localhost:3000
  FRONTEND_URL: http://localhost:3000
  GOOGLE_CALLBACK_URL: http://localhost:8080/api/auth/google/callback
  # The tests use a signed local OIDC provider, never a real Google account.
  GOOGLE_CLIENT_ID: ''
  GOOGLE_CLIENT_SECRET: ''
  COOKIE_SAME_SITE: lax

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: HTTP integration tests
        run: pnpm test:e2e

      - name: Validate Prisma schema
        run: pnpm prisma:validate

      - name: Build web and server
        run: pnpm build

  database:
    name: Database integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: commit_health_ci
          # Disposable CI container credentials only.
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: commit_health_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commit_health_ci -d commit_health_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://commit_health_ci:ci_test_only@127.0.0.1:5432/commit_health_test?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply test migrations and run database integration tests
        run: pnpm test:db
